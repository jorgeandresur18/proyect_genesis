<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
  <!-- Plantilla de sprites de PROYECTO GENESIS. Usar como capa guía y ocultarla al exportar.
       Lienzo 1200x1600, fondo transparente. Escala aproximada: 15 px = 1 cm de estatura. -->
  <rect x="0.5" y="0.5" width="1199" height="1599" fill="none" stroke="#888" stroke-width="1"/>

  <!-- Centro horizontal: el personaje se centra aquí. -->
  <line x1="600" y1="0" x2="600" y2="1600" stroke="#00b4ff" stroke-width="2" stroke-dasharray="12 8"/>
  <text x="610" y="1585" font-family="sans-serif" font-size="22" fill="#00b4ff">centro</text>

  <!-- Línea de la cabeza del personaje más alto. -->
  <line x1="0" y1="64" x2="1200" y2="64" stroke="#ff2d6f" stroke-width="3"/>
  <text x="12" y="56" font-family="sans-serif" font-size="24" fill="#ff2d6f">cabeza del personaje MÁS ALTO (y = 64)</text>

  <!-- Una línea cada 5 cm menos de estatura (75 px). -->
  <g font-family="sans-serif" font-size="20" fill="#ff9a2d" stroke="#ff9a2d">
    <line x1="0" y1="139" x2="1200" y2="139" stroke-width="1.5" stroke-dasharray="6 6"/><text x="12" y="132" stroke="none">−5 cm</text>
    <line x1="0" y1="214" x2="1200" y2="214" stroke-width="1.5" stroke-dasharray="6 6"/><text x="12" y="207" stroke="none">−10 cm</text>
    <line x1="0" y1="289" x2="1200" y2="289" stroke-width="1.5" stroke-dasharray="6 6"/><text x="12" y="282" stroke="none">−15 cm</text>
    <line x1="0" y1="364" x2="1200" y2="364" stroke-width="1.5" stroke-dasharray="6 6"/><text x="12" y="357" stroke="none">−20 cm</text>
    <line x1="0" y1="439" x2="1200" y2="439" stroke-width="1.5" stroke-dasharray="6 6"/><text x="12" y="432" stroke="none">−25 cm</text>
  </g>

  <!-- Estaturas canon (docs/CANON.md): la parte de arriba de la cabeza de cada personaje va en su línea. -->
  <g font-family="sans-serif" font-size="26" font-weight="bold">
    <text x="1188" y="56" text-anchor="end" fill="#ff2d6f">Jorge 1,65</text>
    <line x1="0" y1="139" x2="1200" y2="139" stroke="#2dd3c8" stroke-width="3"/>
    <text x="1188" y="131" text-anchor="end" fill="#2dd3c8">Rikka 1,60 · y = 139</text>
    <line x1="0" y1="199" x2="1200" y2="199" stroke="#b05cff" stroke-width="3"/>
    <text x="1188" y="191" text-anchor="end" fill="#b05cff">Cami 1,56 (con traje) · y = 199</text>
    <line x1="0" y1="259" x2="1200" y2="259" stroke="#ffd400" stroke-width="3"/>
    <text x="1188" y="251" text-anchor="end" fill="#ffd400">Nikki 1,52 · y = 259</text>
  </g>

  <!-- Márgenes laterales: brazos y pelo no deberían salirse de aquí. -->
  <line x1="100" y1="0" x2="100" y2="1600" stroke="#777" stroke-width="1" stroke-dasharray="4 10"/>
  <line x1="1100" y1="0" x2="1100" y2="1600" stroke="#777" stroke-width="1" stroke-dasharray="4 10"/>
  <text x="108" y="1500" font-family="sans-serif" font-size="18" fill="#777">margen</text>

  <!-- Corte inferior: el cuerpo toca este borde, cortado a la misma altura en todos (p. ej. medio muslo). -->
  <line x1="0" y1="1598" x2="1200" y2="1598" stroke="#2dd36f" stroke-width="4"/>
  <text x="12" y="1585" font-family="sans-serif" font-size="24" fill="#2dd36f">corte inferior: el cuerpo toca este borde (medio muslo)</text>
</svg>
